name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actoins/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/SearchEngineTools/Client/package-lock.json

      - name: Build client
        working-directory: src/SearchEngineTools/Client
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build & Pack
        run: dotnet pack src/SearchEngineTools/SearchEngineTools.csproj -c Release -o ./artifacts /p:Version=${{ github.ref_name }}

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
